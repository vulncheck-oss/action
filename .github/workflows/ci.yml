name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: write-all

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      - name: Check Format
        id: npm-format-check
        run: npm run format:check

      - name: Lint
        id: npm-lint
        run: npm run lint

      - name: Test
        id: npm-ci-test
        run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v6

      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          token: ${{ secrets.VC_TOKEN }}
          scan-path: __tests__/fixtures/scan-target
          scan-cvss-base-threshold: '11'
          disable-pr-comment: 'true'

      - name: Assert Scan Ran
        env:
          SCAN_COUNT: ${{ steps.test-action.outputs.scan-count }}
          SCAN_SIGNATURE: ${{ steps.test-action.outputs.scan-signature }}
          SCAN_OUTPUT: ${{ steps.test-action.outputs.scan-output }}
        run: |
          echo "scan-count:     $SCAN_COUNT"
          echo "scan-signature: $SCAN_SIGNATURE"
          echo "scan-output:    $SCAN_OUTPUT"
          test -n "$SCAN_SIGNATURE"
          test "$SCAN_COUNT" -gt 0
